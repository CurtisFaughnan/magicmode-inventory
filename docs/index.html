<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="MagicMode Inventory — production materials control built from the company BOM.">
  <meta http-equiv="refresh" content="4;url=https://magicmode-inventory.faughnancurtis2.chatgpt.site">
  <title>MagicMode Inventory</title>
  <style>
    :root{color-scheme:light;--ink:#17332e;--lime:#dff36b;--paper:#f4f7f3;--muted:#70817d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 15%,#e7efce,transparent 35%),var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:24px}.card{width:min(760px,100%);background:#fff;border:1px solid #dce5df;border-radius:24px;padding:clamp(32px,7vw,70px);box-shadow:0 30px 80px #17332e18}.mark{width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:var(--ink);color:var(--lime);font:italic 30px Georgia}p.label{margin:28px 0 12px;color:#167a5b;font-size:12px;font-weight:900;letter-spacing:.14em}h1{font:600 clamp(46px,8vw,78px)/.95 Georgia;margin:0;letter-spacing:-.04em}h1 em{color:#167a5b}.copy{max-width:580px;color:var(--muted);line-height:1.65;font-size:17px;margin:24px 0 30px}.button{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:800;padding:14px 20px;border-radius:11px}.note{display:block;color:var(--muted);font-size:12px;margin-top:16px}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">V</div>
    <p class="label">PRODUCTION MATERIALS CONTROL</p>
    <h1>MagicMode <em>Inventory</em></h1>

    <a class="button" href="https://magicmode-inventory.faughnancurtis2.chatgpt.site">Open inventory app →</a>
    <small class="note">Opening automatically in a few seconds.</small>
  </main>
</body>
</html>
